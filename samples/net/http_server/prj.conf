# General
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_RESET_ON_FATAL_ERROR=n

# LED Control
CONFIG_DK_LIBRARY=y

# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_MAX_CONN=15
CONFIG_NET_MAX_CONTEXTS=20

# Network buffers
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=48

# HTTP
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y

# HTTP Server Sample Configuration
CONFIG_HTTP_SERVER_SAMPLE_CLIENTS_MAX=3
CONFIG_HTTP_SERVER_SAMPLE_STACK_SIZE=4096

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Ethernet L2 layer support (required for DM9051)
CONFIG_NET_L2_ETHERNET=y

# DM9051 Ethernet controller driver
CONFIG_ETH_DM9051=y
#CONFIG_ETH_ENC28J60=y

# SPI support (DM9051 uses SPI interface)
CONFIG_SPI=y


# Increase the network buffer data size to accommodate a full MTU packet
# This prevents fragmentation for large packets and avoids the "Uncontiguous data cannot be linearized" error
CONFIG_NET_BUF_DATA_SIZE=1024

# --- Resource Allocation for Large Packets ---
# Explicitly enable IPv4 fragment reassembly
CONFIG_NET_IPV4_FRAGMENT=y

# Increase the number of RX/TX packets and buffers to handle fragmentation
# CONFIG_NET_PKT_RX_COUNT=16
# CONFIG_NET_PKT_TX_COUNT=16
# CONFIG_NET_BUF_RX_COUNT=32
# CONFIG_NET_BUF_TX_COUNT=32