CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_DNS_RESOLVER=y

# HTTP Parser
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y

# Connection Manager
CONFIG_NET_CONNECTION_MANAGER=y

# Sockets
CONFIG_NET_SOCKETS=y

CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_INIT_STACKS=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Enable POSIX API for socket functions
# CONFIG_NET_SOCKETS_POSIX_NAMES is deprecated, use CONFIG_POSIX_API instead
CONFIG_POSIX_API=y

#CONFIG_NET_LOG=y
CONFIG_LOG=y

CONFIG_SLIP_STATISTICS=n
CONFIG_NET_SHELL=y

# Config logger
#CONFIG_USE_SEGGER_RTT=n
#CONFIG_LOG_BACKEND_RTT=n

# ensure printk available
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
